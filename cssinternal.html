<!DOCTYPE html>
<html lang="en">
<head> 
    <!-- internal css-->
    <style>
        p{
            color: blue;
            font-family: 'Courier New', Courier, monospace;
            font-style: italic;
        }
        .third{
            color: grey;
        }
        .fourth{
            color: green;
        }
    </style>
</head>

<body>
    <p style="color: blue;font-family: 'Times New Roman', Times, serif;">This is the first Sentence</p>
    <p>This is the second Sentence</p>
    <p class="third">This is the third Sentence</p>
    <p class="fourth">This is the forth Sentence</p>
</body>
</html>
